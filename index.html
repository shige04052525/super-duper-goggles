<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#1457b5"><title>GRANT HOME 管理</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif;color:#223248;background:#f2f5fa}*{box-sizing:border-box}body{margin:0}.app{max-width:960px;margin:auto;padding:18px 14px 100px}header{display:flex;justify-content:space-between;align-items:center}h1{font-size:21px;margin:4px 0}h2{font-size:17px;margin:9px 0 15px}h3{font-size:15px;margin:8px 0}.muted,small{color:#758296;font-size:12px}.pill,.tag{font-size:11px;border-radius:25px;padding:6px 9px;background:#e8effa}.tabs,.row,.actions{display:flex;gap:8px;align-items:center;justify-content:space-between}.tabs{justify-content:flex-start;margin:16px 0}.btn,.tabs button{border:0;border-radius:10px;padding:10px 12px;background:#e7edf6;color:#263b55;font-weight:700;cursor:pointer}.btn.primary,.tabs button.active{background:#1559ba;color:white}.btn.danger{background:#fff0ef;color:#ba3535}.card{background:white;border-radius:16px;padding:15px;margin:12px 0;box-shadow:0 3px 14px #1227440b}.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.stat{text-align:center}.stat strong{font-size:21px;color:#1457b5;display:block;overflow-wrap:anywhere}.item{border-top:1px solid #e9eef5;padding:12px 0}.item:first-child{border-top:0}.bar{height:8px;border-radius:9px;background:#e7edf5;margin:9px 0}.bar i{display:block;height:100%;border-radius:9px;background:#2778d0}input,select,textarea{width:100%;padding:11px;border:1px solid #d8e1ec;border-radius:9px;background:white;font:inherit;margin:5px 0 12px}label{font-size:13px;font-weight:700}textarea{min-height:75px}.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.calendar{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}.dayhead{text-align:center;color:#758296;font-size:11px;padding:6px 0}.day{background:#f4f7fb;border:1px solid transparent;border-radius:8px;min-height:77px;padding:4px;text-align:left;overflow:hidden;cursor:pointer}.day.sel{border-color:#1559ba;background:#e9f2ff}.daynum{font-size:12px;font-weight:700}.cal-event{display:block;border-radius:4px;font-size:9px;padding:2px 3px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:white}.stage-row{display:grid;grid-template-columns:25px minmax(0,1fr) 112px;gap:8px;align-items:center;border-top:1px solid #eef1f5;padding:9px 0}.stage-row input[type=checkbox]{width:20px;height:20px;margin:0;accent-color:#1b69c9}.stage-row input[type=date]{font-size:12px;margin:0;padding:8px 3px}.stage-name{font-size:13px;font-weight:700}.notice{background:#fff6e7;padding:12px;border-radius:10px;margin:8px 0;font-size:13px}.alert{border-left:4px solid #e59c2c;padding:10px;background:#fff9ed;margin:8px 0;border-radius:7px}.bottom{position:fixed;bottom:0;left:0;right:0;background:#fffffffa;border-top:1px solid #dce5f0;display:flex;justify-content:space-around;padding:9px 2px max(10px,env(safe-area-inset-bottom));z-index:10}.bottom button{border:0;background:none;font-size:11px;color:#64748b;cursor:pointer}.bottom button.on{color:#1457b5;font-weight:800}.money{font-variant-numeric:tabular-nums}.color-dot{width:11px;height:11px;display:inline-block;border-radius:50%;vertical-align:middle;margin-right:4px}.flexwrap{display:flex;gap:8px;flex-wrap:wrap}.tiny{font-size:11px}.scroll{overflow-x:auto}@media(min-width:700px){.bottom{max-width:960px;margin:auto}.day{min-height:100px}.cal-event{font-size:11px}}@media(max-width:370px){.stage-row{grid-template-columns:23px minmax(0,1fr) 100px}.stage-row input[type=date]{font-size:10px}}
.month-hero{background:linear-gradient(135deg,#143c76,#1e67b5);color:white}.month-hero .muted{color:#d4e5ff}.month-amount{font-size:clamp(29px,8vw,42px);font-weight:850;margin:10px 0 6px;overflow-wrap:anywhere}.pay-line{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;flex-wrap:wrap;font-size:12px;color:#e5efff}.pay-line span{text-align:right;margin-left:auto}.pay-line b{display:block;font-size:16px;color:white;margin-top:4px}
/* v3.5: current and next month land/building settlement counters */
.dashboard-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:8px 0 12px}
.dashboard-head h2{margin:0;font-size:19px;white-space:nowrap}
.dashboard-mini{display:flex;gap:6px;align-items:center}
.dashboard-mini .mini-stat{background:#fff;border:1px solid #e1e9f4;border-radius:11px;padding:7px 9px;min-width:66px;text-align:center;box-shadow:0 2px 8px #12274408}
.dashboard-mini strong{display:block;color:#1457b5;font-size:19px;line-height:1.15}
.dashboard-mini small{display:block;font-size:10px;color:#65758b;white-space:nowrap;margin-top:3px}
.company-revenue{background:#fff;border:1px solid #e1e9f4;padding:23px 18px;text-align:left}
.company-revenue .revenue-label{color:#1457b5;font-size:15px;font-weight:800}
.company-revenue .revenue-number{display:block;color:#1457b5;font-size:clamp(30px,8vw,46px);font-weight:850;line-height:1.3;overflow-wrap:anywhere;margin-top:10px}
.company-revenue .revenue-note{display:block;color:#64748b;font-size:11px;margin-top:6px}
@media(max-width:370px){.dashboard-head h2{font-size:17px}.dashboard-mini .mini-stat{min-width:59px;padding:6px}.dashboard-mini strong{font-size:17px}}
/* v3.3: visually separate each property without changing its functionality */
#projectResults{display:flex;flex-direction:column;gap:14px;margin-top:16px}
#projectResults .project-tile{display:block;background:#fff;border:1px solid #dce5f0;border-radius:16px;padding:18px 16px;margin:0;box-shadow:0 3px 12px rgba(20,60,118,.07)}
#projectResults .project-tile .row{align-items:center}
#projectResults .project-tile + .project-tile{margin-top:0}
@media(max-width:390px){#projectResults .project-tile{padding:16px 12px}}
.home-project-list{display:flex;flex-direction:column;gap:13px;margin-top:12px}.home-project-list .project-tile{border:1px solid #dce5f0;border-radius:16px;background:#fff;padding:16px;box-shadow:0 3px 12px #143c7612;margin:0}.loan-choices{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;margin:7px 0 12px}.loan-choices label{font-size:11px;display:flex;flex-direction:row;justify-content:center;align-items:center;gap:3px;padding:8px 2px;border:1px solid #dce5f0;border-radius:8px;white-space:nowrap;min-width:0;line-height:1.2}.loan-choices input[type=radio]{width:14px;height:14px;min-width:14px;margin:0;padding:0;flex:none;accent-color:#1559ba}.loan-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}.loan-grid input{width:100%;min-width:0}.loan-total{padding:14px;margin:12px 0;background:#edf5ff;border-radius:12px;display:flex;justify-content:space-between;gap:6px}</style><link rel="manifest" href="./manifest.webmanifest"><link rel="apple-touch-icon" href="./icon-192.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="GRANT HOME"><style>
/* 決済予定月の物件一覧色分け：今月／来月。決済済みは通常表示 */
.project-tile.settlement-this-month{background:#fff0e3;border:2px solid #f4a261;}
.project-tile.settlement-next-month{background:#edf9e8;border:2px solid #95cd7b;}

</head><body><div class="app"><header><div><small>GRANT HOME</small><h1>物件・工程・売上 管理</h1></div><span class="pill">改良版 v4.1</span></header><div class="tabs"><button id="allMode" onclick="setMode('all')">会社全体</button><button id="mineMode" onclick="setMode('mine')">自分の担当</button></div><main id="view"></main></div><nav class="bottom"><button id="nav-home" onclick="go('home')">⌂<br>ホーム</button><button id="nav-projects" onclick="go('projects')">▤<br>物件</button><button id="nav-calendar" onclick="go('calendar')">▦<br>カレンダー</button><button id="nav-sales" onclick="go('sales')">¥<br>売上</button><button id="nav-add" onclick="go('add')">＋<br>登録</button><button id="nav-settings" onclick="go('settings')">⚙<br>設定</button></nav><script>
'use strict';
const STAGES=['土地売買契約','住宅ローン事前審査','住宅ローン本審査','土地決済','設計・打合せ','LIXILショールーム','建築確認','着工','工務店打ち合わせ','上棟','表示登記','完成','建物決済','引き渡し'];
const TYPES=[['contract','契約','#2374cf'],['settlement','決済','#21936b'],['construction','建築','#df8a28'],['meeting','打合せ・案内','#8055c5'],['private','プライベート','#e87892'],['other','その他','#65758b']];
const DEFAULTS={projects:[],events:[]};
const STORE='grant-demo-v2';let data;try{data=JSON.parse(localStorage.getItem(STORE))||JSON.parse(JSON.stringify(DEFAULTS))}catch(e){data=JSON.parse(JSON.stringify(DEFAULTS))}
if(!Array.isArray(data.projects))data.projects=[];if(!Array.isArray(data.events))data.events=[];
// Stage migration is idempotent and keeps the existing storage key and backups.
for(const p of data.projects){if(!p.stageSchemaV4){const prev=p.stages||[];const mapping=[0,1,2,3,4,6,7,9,11,12,13];p.stages=STAGES.map(()=>({done:false,date:''}));mapping.forEach((j,i)=>{if(prev[i])p.stages[j]={done:!!prev[i].done,date:prev[i].date||''}});for(const sale of p.sales||[]){const i=Number(sale.stageIndex);if(mapping[i]!==undefined)sale.stageIndex=mapping[i]}p.stageSchemaV4=true}}localStorage.setItem(STORE,JSON.stringify(data));
let projectQuery='',page='home',mode='all',selected=localDate(),month=selected.slice(0,7),editId=null;
function localDate(d=new Date()){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function parseDate(s){return new Date(s+'T12:00:00')}
function diffDays(s){return Math.round((parseDate(s)-parseDate(localDate()))/86400000)}
const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const yen=n=>'¥'+Number(n||0).toLocaleString('ja-JP');
function save(){if(window.GRANT_SHARED?.enabled&&!window.GRANT_SHARED.ready){alert("共有データの読み込み中です。少し待ってから操作してください。");return}try{localStorage.setItem(STORE,JSON.stringify(data))}catch(e){alert('保存できませんでした。容量またはブラウザ設定をご確認ください。')}if(window.GRANT_SHARED?.enabled)window.GRANT_SHARED.push(data)}
function stageData(p){return STAGES.map((s,i)=>({name:s,done:!!p.stages?.[i]?.done,date:p.stages?.[i]?.date||''}))}
function pct(p){return Math.round(stageData(p).filter(x=>x.done).length/STAGES.length*100)}
function myName(){return localStorage.getItem('grant-my-name')||'自分'}
function visible(){return data.projects.filter(p=>mode==='all'||p.person===myName()||p.person==='自分')}
function setMode(m){mode=m;render()}
function go(p){page=p;editId=null;render()}
function normalizeType(t){const s=String(t||'').trim().toLowerCase();const aliases={'契約':'contract','売買契約':'contract','contract':'contract','決済':'settlement','引渡し':'settlement','settlement':'settlement','建築':'construction','工事':'construction','construction':'construction','打合せ':'meeting','案内':'meeting','打合せ・案内':'meeting','meeting':'meeting','プライベート':'private','private':'private','その他':'other','other':'other'};return aliases[s]||s}
function typeColor(t){return TYPES.find(x=>x[0]===normalizeType(t))?.[2]||'#65758b'}
function stageType(i){return i===0?'contract':[3,12,13].includes(i)?'settlement':[1,2,4,5,8].includes(i)?'meeting':'construction'}
function eventsAll(){const manual=data.events.filter(e=>e.type!=='private'||(e.owner===myName()||e.owner==='自分')).filter(e=>mode==='all'||e.type==='private'||!e.project||visible().some(p=>String(p.id)===String(e.project)));const derived=visible().flatMap(p=>stageData(p).flatMap((s,i)=>s.date?[{id:'stage-'+p.id+'-'+i,title:(p.client||p.name)+'・'+s.name,date:s.date,type:stageType(i),project:p.id,stageIndex:i,derived:true,done:s.done}]:[]));return [...manual,...derived]}
function revenues(){return visible().flatMap(p=>(p.sales||[]).filter(s=>s.amount>0).map(s=>({...s,person:p.person,client:p.client,projectName:p.name,project:p.id,date:stageData(p)[Number(s.stageIndex)]?.date||''})))}
function monthSales(ym,ownerOnly=false){return revenues().filter(r=>r.date&&r.date.slice(0,7)===ym&&(!ownerOnly||(r.person===myName()||r.person==='自分')))}
function sumSales(rs){return rs.reduce((a,r)=>a+Number(r.amount||0),0)}
function payEstimate(ym){return Math.round(sumSales(monthSales(ym,true))*0.25)}
function monthSummary(ym){const rs=monthSales(ym),total=sumSales(rs),pay=payEstimate(ym);return `<div class="card month-hero"><div class="muted">${esc(ym.replace('-','年'))}月 売上予定（税込）</div><div class="month-amount money">${yen(total)}</div><div class="pay-line">自分の売上 ${yen(sumSales(monthSales(ym,true)))} <span>給与見込（25%） <b>${yen(pay)}</b></span></div></div><div class="card"><h3>この月の売上内訳</h3>${rs.length?rs.sort((a,b)=>a.date.localeCompare(b.date)).map(r=>`<div class="item"><div class="row"><div><b>${esc(r.client||r.projectName)}</b><div><small>${esc(r.date)} ・ ${esc(STAGES[r.stageIndex]||'その他')} ・ ${esc(r.person||'')}</small></div></div><b class="money">${yen(r.amount)}</b></div></div>`).join(''):'<p class="muted">この月の売上予定はまだありません</p>'}</div>`}
function salesMonthTable(){const months=new Set([month,localDate().slice(0,7)]);revenues().forEach(r=>{if(r.date)months.add(r.date.slice(0,7))});return [...months].sort().map(ym=>`<div class="item row"><div><b>${esc(ym.replace('-','年'))}月</b><div><small>自分の給与見込 ${yen(payEstimate(ym))}</small></div></div><b class="money">${yen(sumSales(monthSales(ym)))}</b></div>`).join('')}
function upcoming(){return eventsAll().filter(e=>e.date>=localDate()).sort((a,b)=>a.date.localeCompare(b.date))}
function projectMatch(p){return [p.name,p.client,p.person,p.memo,p.phone,p.email].join(' ').toLowerCase().includes(projectQuery.toLowerCase())}
function filterProjects(){const el=$('projectResults');if(el)el.innerHTML=visible().filter(projectMatch).map(projectHTML).join('')||'該当する物件はありません'}
function contracted(p){return !!p.stages?.[0]?.done}
function cumulativeSales(){return visible().filter(contracted).reduce((total,p)=>total+(p.sales||[]).reduce((a,s)=>a+Number(s.amount||0),0),0)}
function nextStage(p){return stageData(p).findIndex(s=>!s.done)}
function completeNextStage(id){const p=data.projects.find(x=>x.id===id);if(!p)return;const i=nextStage(p);if(i<0)return;if(i===0&&!confirm('土地売買契約が完了したものとして登録しますか？\n登録済みの会社売上が累計に反映されます。'))return;p.stages=stageData(p);p.stages[i].done=true;save();render()}
function settlementTileClass(p){
 const today=localDate(),ym=today.slice(0,7),following=nextMonth(ym);
 // 建物決済を優先し、未設定なら土地決済を確認する。
 const stages=stageData(p);
 const pending=[12,3].map(i=>stages[i]).filter(s=>s.date&&!s.done&&s.date>=today);
 if(!pending.length)return '';
 const target=pending[0].date.slice(0,7);
 return target===ym?' settlement-this-month':target===following?' settlement-next-month':'';
}
function projectHTML(p){const i=nextStage(p);return `<div class="item project-tile${settlementTileClass(p)}"><div class="row"><div style="min-width:0;flex:1"><b style="font-size:18px;display:block;overflow-wrap:anywhere">${esc(p.client||'お客様名未登録')}</b><div style="color:#8995a5;font-size:12px;margin-top:4px;overflow-wrap:anywhere">${esc(p.name)} ・ ${esc(p.person)}</div></div><button class="btn" onclick="openProject(${p.id})">詳細 →</button></div><div class="row" style="margin-top:12px;align-items:center;gap:8px"><div style="flex:1"><small style="color:#64748b">次の工程</small><div style="font-weight:700;margin-top:3px">${i<0?'全工程完了':esc(STAGES[i])}</div>${i>=0&&p.stages?.[i]?.date?`<small>予定日：${esc(p.stages[i].date)}</small>`:''}</div>${i>=0?`<button class="btn primary" onclick="completeNextStage(${p.id})">✓ 完了</button>`:'<small>✓ 完了済み</small>'}</div></div>`}
function eventHTML(e){return `<div class="item"><div class="row"><div><span class="color-dot" style="background:${typeColor(e.type)}"></span><b>${esc(e.title)}</b><div><small>${esc(e.date)} ${esc(e.time||'')} ${e.note?'・'+esc(e.note):''} ${e.derived?(e.done?'・完了':'・未完了'):''}</small></div></div><button class="btn" onclick="${e.derived?'openProject('+e.project+')':'editEvent('+e.id+')'}">開く</button></div></div>`}
function settlementCount(ym){return data.projects.reduce((count,p)=>count+[3,12].filter(i=>{const d=p.stages?.[i]?.date||'';return d.slice(0,7)===ym}).length,0)}
function nextMonth(ym){const [y,m]=ym.split('-').map(Number);const d=new Date(y,m,1);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')}
function reminders(){return eventsAll().filter(e=>e.derived&&[0,1,3].includes(diffDays(e.date))&&!e.done&&[3,12,13].includes(e.stageIndex)).sort((a,b)=>a.date.localeCompare(b.date))}
function render(){document.querySelectorAll('.bottom button').forEach(b=>b.classList.toggle('on',b.id==='nav-'+page));$('allMode').classList.toggle('active',mode==='all');$('mineMode').classList.toggle('active',mode==='mine');let h='';
if(page==='home'){const r=revenues(),total=r.reduce((a,x)=>a+Number(x.amount),0),alerts=reminders(),thisYm=localDate().slice(0,7),nextYm=nextMonth(thisYm);h=`<div class="dashboard-head"><h2>ダッシュボード</h2><div class="dashboard-mini"><div class="mini-stat"><strong>${settlementCount(thisYm)}</strong><small>${Number(thisYm.slice(5))}月決済</small></div><div class="mini-stat"><strong>${settlementCount(nextYm)}</strong><small>${Number(nextYm.slice(5))}月決済</small></div></div></div><div class="card company-revenue"><div class="revenue-label">売上総額（税込）</div><strong class="revenue-number money">${yen(data.projects.filter(contracted).reduce((sum,p)=>sum+(p.sales||[]).reduce((a,s)=>a+Number(s.amount||0),0),0))}</strong><small class="revenue-note">会社全体の累計売上・土地売買契約完了分</small></div>${monthSummary(localDate().slice(0,7))}<div class="card"><h2>🔔 決済・引渡しのお知らせ</h2>${alerts.length?alerts.map(e=>`<div class="alert"><b>${diffDays(e.date)===0?'本日':diffDays(e.date)===1?'明日':'3日後'}：${esc(e.title)}</b><div><small>${esc(e.date)}</small></div><button class="btn" onclick="openProject(${e.project})">物件を開く</button></div>`).join(''):'直近の対象予定はありません'}<p class="muted">3日前・前日・当日、アプリを開いたときに表示します。</p></div><div class="card"><div class="row"><h2>これからの予定</h2><button class="btn" onclick="go('calendar')">カレンダー →</button></div>${upcoming().slice(0,6).map(eventHTML).join('')||'予定はありません'}</div><div class="card"><h2>物件の進捗</h2><div class="home-project-list">${visible().map(projectHTML).join('')||'物件を登録してください'}</div></div>`}
else if(page==='projects'){h=`<div class="row"><div><h2 style="margin-bottom:2px">物件一覧</h2><small style="color:#64748b">${mode==='all'?'会社全体':'自分の担当'}の累計売上（税込） <b class="money" style="color:#143c76;font-size:16px">${yen(cumulativeSales())}</b></small></div><button class="btn primary" onclick="go('add')">＋ 新規登録</button></div><div class="card"><input type="search" id="projectSearch" placeholder="物件名・お客様名・担当者で検索" value="${esc(projectQuery)}" oninput="projectQuery=this.value;filterProjects()"><div id="projectResults">${visible().filter(p=>projectMatch(p)).map(projectHTML).join('')||'該当する物件はありません'}</div></div>`}
else if(page==='calendar'){const [y,m]=month.split('-').map(Number),first=new Date(y,m-1,1).getDay(),last=new Date(y,m,0).getDate(),evs=eventsAll();h=`<div class="row"><button class="btn" onclick="shiftMonth(-1)">‹</button><h2>${y}年 ${m}月</h2><button class="btn" onclick="shiftMonth(1)">›</button></div><div class="card"><div class="calendar">${['日','月','火','水','木','金','土'].map(x=>`<div class="dayhead">${x}</div>`).join('')}${'<div></div>'.repeat(first)}${Array.from({length:last},(_,i)=>{let d=month+'-'+String(i+1).padStart(2,'0'),es=evs.filter(e=>e.date===d);return `<button class="day ${selected===d?'sel':''}" onclick="pickDay('${d}')"><span class="daynum">${i+1}</span>${es.slice(0,3).map(e=>`<span class="cal-event" style="background:${typeColor(e.type)}">${esc(e.title)}</span>`).join('')}${es.length>3?'<small>＋'+(es.length-3)+'件</small>':''}</button>`}).join('')}</div><div class="flexwrap" style="margin-top:12px">${TYPES.map(t=>`<small><span class="color-dot" style="background:${t[2]}"></span>${t[1]}</small>`).join('')}</div></div><div class="card"><div class="row"><h2>${esc(selected)} の予定</h2><button class="btn primary" onclick="newEvent('${selected}')">＋ 予定</button></div>${evs.filter(e=>e.date===selected).map(eventHTML).join('')||'予定はありません'}</div>${monthSummary(month)}`}
else if(page==='sales'){const rs=revenues(),sum=rs.reduce((a,r)=>a+Number(r.amount),0),groups=(key)=>{const map={};rs.forEach(r=>{let k=key(r)||'未設定';map[k]=(map[k]||0)+Number(r.amount)});return Object.entries(map).sort((a,b)=>a[0].localeCompare(b[0])).map(([k,v])=>`<div class="item row"><b>${esc(k)}</b><b class="money">${yen(v)}</b></div>`).join('')||'<p class="muted">まだ登録がありません</p>'};h=`<h2>売上管理（税込）</h2><div class="card"><h2>月別売上予定・自分の給与見込</h2>${salesMonthTable()}</div><div class="card stat"><small>会社・表示対象の売上合計</small><strong>${yen(sum)}</strong></div><div class="card"><h2>月別売上（工程予定日ベース）</h2>${groups(r=>r.date?r.date.slice(0,7):'日付未設定')}</div><div class="card"><h2>担当者別売上</h2>${groups(r=>r.person)}</div><div class="card"><h2>お客様・物件別売上</h2>${groups(r=>r.client+' ／ '+r.projectName)}</div><div class="card"><h2>売上内訳</h2>${rs.map(r=>`<div class="item"><b>${esc(r.client||r.projectName)}</b><div class="row"><small>${esc(STAGES[r.stageIndex]||'その他')} ／ ${esc(r.date||'日付未設定')}</small><b>${yen(r.amount)}</b></div></div>`).join('')||'売上の登録は物件詳細からできます'}</div>`}
else if(page==='add'){h=`<h2>新規登録</h2><div class="card"><h2>物件・お客様を登録</h2>${projectForm()}</div><div class="card"><h2>予定を登録</h2>${eventForm()}</div>`}
else if(page==='settings'){h=`<h2>設定・データ管理</h2><div class="card"><h3>音声アシスタント</h3><p class="muted">対応ブラウザでは「今日の予定教えて」「明日の15時に大森様の案内を入れて」などを話せます。音声認識が使えない場合は文字入力できます。</p><input id="voiceCommand" placeholder="例：今日の予定教えて"><div class="flexwrap"><button class="btn primary" onclick="runVoiceCommand()">実行</button><button class="btn" onclick="listenCommand()">🎙 話す</button></div><div id="voiceAnswer" class="muted" aria-live="polite"></div><h3>自分の担当者名</h3><p class="muted">担当物件の絞り込みと新規登録に使います。</p><input id="myNameInput" value="${esc(myName())}" placeholder="例：竹山"><button class="btn primary" onclick="saveMyName()">担当者名を保存</button><h3>バックアップ</h3><p>データはこの端末のブラウザに保存されます。アプリのURL・ブラウザが変わるとデータは自動移行されません。</p><div class="flexwrap"><button class="btn primary" onclick="exportData()">データを書き出す</button><label class="btn" style="cursor:pointer">バックアップを読み込む<input type="file" accept="application/json,.json" style="display:none" onchange="importData(this)"></label></div></div><div class="card"><h3>通知と共有について</h3><p>決済3日前・前日・当日の案内はアプリ内で表示されます。アプリを閉じている間のiPhoneプッシュ通知は未対応です。社員間のリアルタイム同期・ログイン・個人予定の厳密なアクセス制御も未実装です。</p><p>本格的に社員全員で使う場合は、サーバー保存と権限管理を追加してください。</p></div><div class="card"><h3>旧版のデータについて</h3><p>以前の試作品と同じブラウザ・同じサイトで開いている場合は、旧版の物件・予定を取り込めます。</p><button class="btn" onclick="migrateOld()">旧版データを取り込む</button></div>`}
$('view').innerHTML=h}
function shiftMonth(n){let [y,m]=month.split('-').map(Number),d=new Date(y,m-1+n,1);month=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');selected=month+'-01';render()}
function pickDay(d){selected=d;newEvent(d)}
function openProject(id){let p=data.projects.find(x=>x.id===id);if(!p)return;page='projects';document.querySelectorAll('.bottom button').forEach(b=>b.classList.toggle('on',b.id==='nav-projects'));$('view').innerHTML=`<div class="row"><h2>${esc(p.name)}</h2><button class="btn" onclick="go('projects')">戻る</button></div><div class="card">${projectForm(p)}</div><div class="card"><div class="row"><h2>工程チェック・予定日</h2><b>${pct(p)}%</b></div><p class="muted">日付を入れるとカレンダーに自動反映。チェックで完了に切り替わります。</p>${stageData(p).map((s,i)=>`<div class="stage-row"><input aria-label="${esc(s.name)} 完了" type="checkbox" ${s.done?'checked':''} onchange="updateStage(${p.id},${i},'done',this.checked)"><div class="stage-name">${esc(s.name)}${s.done?' <small>✓ 完了</small>':''}</div><input aria-label="${esc(s.name)} 日付" type="date" value="${esc(s.date)}" onchange="updateStage(${p.id},${i},'date',this.value)"></div>`).join('')}</div><div class="card"><h2>売上登録（税込）</h2><p class="muted">会社の売上金額を登録。物件一覧の累計には「土地売買契約」の工程チェック完了後に反映されます。日付は工程表から連動します。</p>${(p.sales||[]).map((s,i)=>`<div class="item"><div class="row"><b>${esc(STAGES[s.stageIndex]||'その他')}</b><b>${yen(s.amount)}</b></div><button class="btn danger" onclick="removeSale(${p.id},${i})">削除</button></div>`).join('')}<form onsubmit="addSale(event,${p.id})"><label>売上のタイミング</label><select id="sale-stage">${STAGES.map((s,i)=>`<option value="${i}" ${i===3?'selected':''}>${esc(s)}</option>`).join('')}</select><label>売上金額（税込・円）</label><input id="sale-amount" type="number" min="0" step="1" required placeholder="例：1650000"><button class="btn primary" type="submit">＋ 売上を追加</button></form></div><div class="card"><button class="btn danger" onclick="deleteProject(${p.id})">この物件を削除</button></div>`}
function projectForm(p={}){return `<form onsubmit="submitProject(event,${p.id||0})"><label>物件名</label><input id="pname" required value="${esc(p.name||'')}" placeholder="例：豊里6丁目 新築住宅"><label>お客様名</label><input id="pclient" value="${esc(p.client||'')}" placeholder="例：田中様"><label>担当者</label><input id="pperson" value="${esc(p.person||myName())}" placeholder="例：竹山"><label>お客様電話番号</label><input id="pphone" type="tel" value="${esc(p.phone||'')}" placeholder="例：090-0000-0000"><label>お客様メール</label><input id="pemail" type="email" value="${esc(p.email||'')}"><label>住宅ローン名義</label><div class="loan-choices">${['ご主人様','奥様','ペア','収入合算'].map(v=>`<label><input type="radio" name="loanType" value="${v}" ${(p.loanType===v||({'ご主人様ローン':'ご主人様','奥様ローン':'奥様','ペアローン':'ペア'}[p.loanType]===v))?'checked':''}>${v}</label>`).join('')}</div><label>借入予定額（万円）</label><div class="loan-grid">${[['loanLand','土地'],['loanBuilding','建物'],['loanExpenses','諸費用']].map(([k,label])=>`<div><label>${label}</label><input type="number" min="0" step="0.1" id="${k}" value="${esc(p[k]??'')}" oninput="calcLoan()" placeholder="万円"></div>`).join('')}</div><div class="loan-total">借入予定額 合計 <b id="loanTotal">${Number(p.loanLand||0)+Number(p.loanBuilding||0)+Number(p.loanExpenses||0)}万円</b></div><label>メモ</label><textarea id="pmemo">${esc(p.memo||'')}</textarea><button class="btn primary" type="submit">${p.id?'基本情報を保存':'物件を登録'}</button></form>`}
function calcLoan(){const total=['loanLand','loanBuilding','loanExpenses'].reduce((n,k)=>n+Number($(k)?.value||0),0);$('loanTotal').textContent=total.toLocaleString('ja-JP')+'万円'}
function submitProject(e,id){e.preventDefault();const p={id:id||Date.now(),name:$('pname').value.trim(),client:$('pclient').value.trim(),person:$('pperson').value.trim()||myName(),phone:$('pphone').value.trim(),email:$('pemail').value.trim(),memo:$('pmemo').value,loanType:document.querySelector('input[name=loanType]:checked')?.value||'',loanLand:$('loanLand').value,loanBuilding:$('loanBuilding').value,loanExpenses:$('loanExpenses').value};if(id){const old=data.projects.find(x=>x.id===id);Object.assign(old,p)}else{p.stages=STAGES.map(()=>({done:false,date:''}));p.sales=[];data.projects.push(p)}save();if(id)openProject(id);else openProject(p.id)}
function updateStage(id,i,key,value){const p=data.projects.find(x=>x.id===id);if(!p)return;p.stages=stageData(p);p.stages[i][key]=value;save();openProject(id)}
function addSale(e,id){e.preventDefault();const p=data.projects.find(x=>x.id===id),amount=Number($('sale-amount').value);if(!Number.isFinite(amount)||amount<0)return;p.sales=p.sales||[];p.sales.push({stageIndex:Number($('sale-stage').value),amount});save();openProject(id)}
function removeSale(id,i){if(!confirm('この売上を削除しますか？'))return;const p=data.projects.find(x=>x.id===id);p.sales.splice(i,1);save();openProject(id)}
function deleteProject(id){if(!confirm('物件と工程・売上データを削除しますか？'))return;data.projects=data.projects.filter(p=>p.id!==id);data.events=data.events.filter(e=>String(e.project)!==String(id));save();go('projects')}
function eventForm(e={}){return `<form onsubmit="submitEvent(event,${e.id||0})"><label>予定名</label><input id="etitle" required value="${esc(e.title||'')}" placeholder="例：田中様 物件案内"><button type="button" class="btn" onclick="voiceTitle()">🎙 音声入力</button><p id="voiceStatus" class="muted"></p><div class="two"><div><label>日付</label><input id="edate" type="date" required value="${esc(e.date||selected)}"></div><div><label>時刻</label><input id="etime" type="time" value="${esc(e.time||'10:00')}"></div></div><label>色・予定の種類</label><select id="etype">${TYPES.map(t=>`<option value="${t[0]}" ${normalizeType(e.type)===t[0]?'selected':''}>${t[1]}</option>`).join('')}</select><label>予定メモ</label><textarea id="enote" placeholder="持ち物・場所・打合せ内容など">${esc(e.note||'')}</textarea><label>関連物件</label><select id="eproject"><option value="">なし</option>${data.projects.map(p=>`<option value="${p.id}" ${String(e.project)===String(p.id)?'selected':''}>${esc(p.name)}</option>`).join('')}</select><button class="btn primary" type="submit">${e.id?'変更を保存':'予定を登録'}</button></form>`}
function newEvent(d){selected=d;$('view').innerHTML=`<div class="row"><h2>予定を登録</h2><button class="btn" onclick="go('calendar')">戻る</button></div><div class="card">${eventForm()}</div>`}
function editEvent(id){const e=data.events.find(x=>x.id===id);if(!e)return;$('view').innerHTML=`<div class="row"><h2>予定を編集</h2><button class="btn" onclick="go('calendar')">戻る</button></div><div class="card">${eventForm(e)}</div><button class="btn danger" onclick="deleteEvent(${id})">この予定を削除</button>`}
function submitEvent(e,id){e.preventDefault();const v={id:id||Date.now(),title:$('etitle').value.trim(),date:$('edate').value,time:$('etime').value,type:$('etype').value,project:$('eproject').value,note:$('enote').value,owner:myName()};if(id)data.events=data.events.map(x=>x.id===id?v:x);else data.events.push(v);save();selected=v.date;month=v.date.slice(0,7);go('calendar')}
function deleteEvent(id){if(!confirm('予定を削除しますか？'))return;data.events=data.events.filter(e=>e.id!==id);save();go('calendar')}
function voiceTitle(){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){$('voiceStatus').textContent='音声認識非対応です。iPhoneキーボードのマイクをご利用ください。';return}let r=new SR();r.lang='ja-JP';r.onresult=e=>{$('etitle').value=e.results[0][0].transcript;$('voiceStatus').textContent='入力できました。日時をご確認ください。'};r.onerror=()=>{$('voiceStatus').textContent='音声入力できませんでした。マイクの許可をご確認ください。'};r.start();$('voiceStatus').textContent='話してください…'}
function sayAnswer(message){const out=$('voiceAnswer');if(out)out.textContent=message;if('speechSynthesis' in window){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(message);u.lang='ja-JP';speechSynthesis.speak(u)}}
function dateOffset(n){const d=new Date();d.setDate(d.getDate()+n);return localDate(d)}
function runVoiceCommand(){const input=$('voiceCommand');if(!input)return;const cmd=input.value.trim();let date=cmd.includes('明日')?dateOffset(1):cmd.includes('明後日')?dateOffset(2):localDate();if(cmd.includes('予定')&&(cmd.includes('教えて')||cmd.includes('確認')||cmd.includes('何'))){const ev=eventsAll().filter(e=>e.date===date).sort((a,b)=>(a.time||'').localeCompare(b.time||''));sayAnswer(ev.length?ev.map(e=>(e.time||'時間未定')+' '+e.title).join('。'):date+'の予定はありません');return}const m=cmd.match(/(?:午前|午後)?\s*(\d{1,2})時(?:\s*(\d{1,2})分)?/);if(m){let h=Number(m[1]);if(cmd.includes('午後')&&h<12)h+=12;if(cmd.includes('午前')&&h===12)h=0;const title=cmd.replace(/^(今日|明日|明後日)の?/,'').replace(/(?:午前|午後)?\s*\d{1,2}時(?:\s*\d{1,2}分)?(?:に|から)?/,'').replace(/(?:を)?(?:予定に)?(?:入れて|登録して|追加して).*$/,'').trim();if(!title||h>23){sayAnswer('予定名と時間を確認してください');return}selected=date;newEvent(date);$('etitle').value=title;$('etime').value=String(h).padStart(2,'0')+':'+String(Number(m[2]||0)).padStart(2,'0');$('voiceStatus').textContent='内容を確認して「予定を登録」を押してください。';return}sayAnswer('「今日の予定教えて」または「明日の15時に案内を入れて」のように入力してください')}
function listenCommand(){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){sayAnswer('このブラウザでは音声認識に対応していません。文字入力をご利用ください');return}const r=new SR();r.lang='ja-JP';r.onresult=e=>{$('voiceCommand').value=e.results[0][0].transcript;runVoiceCommand()};r.onerror=()=>sayAnswer('音声認識できませんでした。マイクの許可を確認してください');r.start()}
function saveMyName(){const name=$('myNameInput').value.trim();if(!name)return alert('担当者名を入力してください');localStorage.setItem('grant-my-name',name);alert('担当者名を保存しました');render()}
function exportData(){const a=document.createElement('a');const url=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));a.href=url;a.download='grant-home-backup-v4-1.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function importData(el){const file=el.files?.[0];if(!file)return;const reader=new FileReader();reader.onload=()=>{try{const obj=JSON.parse(reader.result);if(!obj||!Array.isArray(obj.projects)||!Array.isArray(obj.events))throw Error('形式が違います');if(!confirm('現在のデータをバックアップ内容で置き換えますか？'))return;data=obj;save();go('home');alert('読み込みました')}catch(e){alert('読み込めませんでした。正しいバックアップファイルか確認してください。')}};reader.readAsText(file)}
function migrateOld(){let old;try{old=JSON.parse(localStorage.getItem('grant-demo-v1'))}catch(e){}if(!old?.projects?.length&&!old?.events?.length){alert('このサイト内に旧版データが見つかりませんでした。');return}if(!confirm('旧版データを追加しますか？（同じ名前の物件も追加されます）'))return;const idmap={};for(const p of old.projects||[]){const id=Date.now()+Math.floor(Math.random()*1000000);idmap[p.id]=id;const stages=STAGES.map(()=>({done:false,date:''}));const mapping={0:0,1:0,2:4,3:6,4:7,5:9,6:11,7:13};for(let i=0;i<=Number(p.stage||0);i++){const j=mapping[i];if(j!==undefined)stages[j].done=true}if(p.date)stages[13].date=p.date;data.projects.push({id,name:p.name,client:p.client,person:p.person,memo:p.memo,stages,sales:[]})}for(const e of old.events||[]){data.events.push({...e,id:Date.now()+Math.floor(Math.random()*1000000),project:idmap[e.project]||'',owner:'自分',type:e.type==='private'?'private':'meeting'})}save();go('home');alert('旧版のデータを取り込みました。工程の完了状況を確認してください。')}
